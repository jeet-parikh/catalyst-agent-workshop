<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <title>Repo Investigator architecture</title>
  <desc>A request about a public GitHub repo is routed, split by a coordinator into parallel scoped workers, checked by code for valid citations with one retry, and answered by a writer from verified findings only.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;family=DM+Sans:wght@400;500&amp;family=DM+Mono:wght@400;500&amp;display=swap');
    .h { font: 700 64px Inter, Helvetica, Arial, sans-serif; fill: #F4F1EC; }
    .kick { font: 500 22px 'DM Mono', Menlo, monospace; fill: #E8B4A0; letter-spacing: 2px; }
    .t { font: 700 27px Inter, Helvetica, Arial, sans-serif; fill: #F4F1EC; }
    .b { font: 400 19px 'DM Sans', Helvetica, Arial, sans-serif; fill: #B9B2AA; }
    .m { font: 400 16px 'DM Mono', Menlo, monospace; fill: #B9B2AA; }
    .lab { font: 500 16px 'DM Mono', Menlo, monospace; fill: #E8B4A0; letter-spacing: 1.5px; }
    .note { font: 400 16px 'DM Mono', Menlo, monospace; fill: #8C857D; }
    .fail { font: 500 16px 'DM Mono', Menlo, monospace; fill: #E39A86; letter-spacing: 1px; }
    .model { fill: #241813; stroke: #E8B4A0; stroke-width: 2; }
    .code { fill: #121212; stroke: #6B655F; stroke-width: 2; }
    .arrow { fill: none; stroke: #8C857D; stroke-width: 2.5; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8C857D"/>
    </marker>
    <marker id="headFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E39A86"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#000"/>

  <text class="h" x="80" y="118">What I built: Repo Investigator</text>
  <text class="kick" x="80" y="166">A READ-ONLY MULTI-AGENT SYSTEM · ROUTE → DELEGATE → CHECK → ANSWER</text>
  <line x1="80" y1="200" x2="1840" y2="200" stroke="#E8B4A0" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- arrows go first so boxes sit on top -->
  <path class="arrow" d="M280 560 H346"/>
  <path class="arrow" d="M568 560 H634"/>
  <path class="arrow" d="M866 560 C900 560 900 380 932 380"/>
  <path class="arrow" d="M866 560 H932"/>
  <path class="arrow" d="M866 560 C900 560 900 740 932 740"/>
  <path class="arrow" d="M1254 380 C1288 380 1288 560 1320 560"/>
  <path class="arrow" d="M1254 560 H1320"/>
  <path class="arrow" d="M1254 740 C1288 740 1288 560 1320 560"/>
  <path class="arrow" d="M1552 560 H1618"/>
  <path class="arrow" d="M458 635 V778"/>
  <path class="arrow" d="M1730 635 V778"/>
  <path d="M1510 485 V258 H1094 V286" fill="none" stroke="#E39A86" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#headFail)"/>
  <text class="fail" x="1110" y="246">✗ FAILED CITATION → RETRY ONCE, THEN DROP</text>

  <!-- 1 input -->
  <text class="lab" x="80" y="465">1 · INPUT</text>
  <rect class="code" x="80" y="485" width="200" height="150" rx="14"/>
  <text class="t" x="102" y="530">Request</text>
  <text class="b" x="102" y="566">public GitHub</text>
  <text class="b" x="102" y="592">repo + a question</text>
  <text class="m" x="102" y="620">loaded in memory</text>

  <!-- 2 router -->
  <text class="lab" x="348" y="465">2 · ROUTING</text>
  <rect class="model" x="348" y="485" width="220" height="150" rx="14"/>
  <text class="t" x="370" y="530">Router</text>
  <text class="b" x="370" y="566">investigate,</text>
  <text class="b" x="370" y="592">review, or</text>
  <text class="b" x="370" y="618">out of scope</text>
  <text class="note" x="470" y="712">out of scope</text>
  <rect class="code" x="348" y="780" width="220" height="100" rx="14"/>
  <text class="t" x="370" y="822">Stop</text>
  <text class="b" x="370" y="856">can't write or run</text>

  <!-- 3 coordinator -->
  <text class="lab" x="636" y="465">3 · ORCHESTRATOR</text>
  <rect class="model" x="636" y="485" width="230" height="150" rx="14"/>
  <text class="t" x="658" y="530">Coordinator</text>
  <text class="b" x="658" y="566">reads the file tree,</text>
  <text class="b" x="658" y="592">writes 2–4 scoped</text>
  <text class="b" x="658" y="618">assignments</text>

  <!-- 4 workers -->
  <rect x="914" y="288" width="360" height="560" rx="18" fill="none" stroke="#E8B4A0" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 6"/>
  <g>
    <rect class="model" x="934" y="310" width="320" height="140" rx="14"/>
    <text class="t" x="956" y="352">Worker A · code</text>
    <text class="m" x="956" y="390">list_files · read_file</text>
    <text class="m" x="956" y="414">search_code</text>
    <text class="b" x="956" y="436">scope tools.py · 5 calls</text>
  </g>
  <g>
    <rect class="model" x="934" y="490" width="320" height="140" rx="14"/>
    <text class="t" x="956" y="532">Worker B · callers</text>
    <text class="m" x="956" y="570">list_files · read_file</text>
    <text class="m" x="956" y="594">search_code</text>
    <text class="b" x="956" y="616">scope agent.py, app.py · 6</text>
  </g>
  <g>
    <rect class="model" x="934" y="670" width="320" height="140" rx="14"/>
    <text class="t" x="956" y="712">Worker C · tests</text>
    <text class="m" x="956" y="750">list_files · read_file</text>
    <text class="m" x="956" y="774">search_code</text>
    <text class="b" x="956" y="796">scope tests/ · 4 calls</text>
  </g>
  <text class="lab" x="914" y="884">4 · WORKERS IN PARALLEL</text>
  <text class="note" x="914" y="912">each an agent loop in its own context</text>
  <text class="note" x="914" y="938">scope + budget enforced in code · returns claim, path:line, quote</text>

  <!-- 5 check -->
  <text class="lab" x="1322" y="465">5 · EVALUATOR</text>
  <rect class="code" x="1322" y="485" width="230" height="150" rx="14"/>
  <text class="t" x="1344" y="530">Citation check</text>
  <text class="b" x="1344" y="566">file exists?</text>
  <text class="b" x="1344" y="592">line in range?</text>
  <text class="b" x="1344" y="618">quote on that line?</text>

  <!-- 6 writer -->
  <text class="lab" x="1620" y="465">6 · SYNTHESIS</text>
  <rect class="model" x="1620" y="485" width="220" height="150" rx="14"/>
  <text class="t" x="1642" y="530">Writer</text>
  <text class="b" x="1642" y="566">answers from</text>
  <text class="b" x="1642" y="592">verified findings</text>
  <text class="b" x="1642" y="618">only</text>
  <text class="note" x="1742" y="712">output</text>
  <rect class="code" x="1620" y="780" width="220" height="100" rx="14"/>
  <text class="t" x="1642" y="822">Answer</text>
  <text class="b" x="1642" y="856">steps + [F1] links</text>

  <!-- legend -->
  <rect class="model" x="80" y="980" width="34" height="24" rx="6"/>
  <text class="b" x="126" y="999">model call</text>
  <rect class="code" x="260" y="980" width="34" height="24" rx="6"/>
  <text class="b" x="306" y="999">plain Python</text>
  <line x1="450" y1="992" x2="500" y2="992" stroke="#E39A86" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="b" x="514" y="999">repair path</text>
  <text class="note" x="1840" y="999" text-anchor="end">Baseline mode: one worker, whole repo, same tools and check</text>

  <text class="note" x="80" y="1050">y/cs · Catalyst Workshop 2</text>
  <text class="note" x="1840" y="1050" text-anchor="end">github.com/jeet-parikh/catalyst-agent-workshop</text>
</svg>
